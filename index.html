      } else {
        o+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="'+c+'" opacity=".9"/>';
        o+='<text x="'+(x+8)+'" y="'+(y+4)+'" font-size="13" fill="'+c+'" font-family="Barlow Semi Condensed, sans-serif" opacity=".95">'+esc(a.name)+'</text>';
      }
    });

    var dayColor={"Tue AM":"var(--am)","Tue PM":"var(--pm)","Wed":"var(--wed)"};
    STOPS.forEach(function(st){
      if(!st.lat) return;
      var on = (view==="all"||st.day===view);
      var x=X(st.lon),y=Y(st.lat),c=dayColor[st.day];
      o+='<g opacity="'+(on?1:0.18)+'">';
      o+='<circle cx="'+x+'" cy="'+y+'" r="15" fill="'+c+'"/>';
      o+='<text x="'+x+'" y="'+(y+6)+'" text-anchor="middle" font-size="16" font-weight="600" fill="#fff" font-family="Azeret Mono, monospace">'+st.n+'</text>';
      o+='</g>';
    });
    document.getElementById("map").innerHTML=o;
  }

  // ---- cards ----
  function list(){
    var host=document.getElementById("list"); host.innerHTML="";
    var cur=null;
    shown().forEach(function(s){
      if(s.day!==cur){ cur=s.day; var h=document.createElement("h2"); h.textContent=cur; host.appendChild(h); }
      var c=document.createElement("div");
      c.className="card"+(/EXPIRED/i.test(s.note||"")?" expired":"");
      var flags="";
      if(/MOVED/i.test(s.note||"")) flags+='<span class="flag moved">moved</span>';
      if(/EXPIRED/i.test(s.note||"")) flags+='<span class="flag exp">expired</span>';
      if(s.approx) flags+='<span class="flag approx">approx. location</span>';
      var psf = s.sqft ? Math.round(s.price/s.sqft) : null;

      var html='<div class="top"><div class="pin '+cls[s.day]+'">'+s.n+'</div><div>'
        +'<div class="addr">'+esc((s.addr||"").replace(/,\s*AK.*$/,""))+flags+'</div>'
        +'<div class="when">'+esc(s.time||"")+'</div></div>'
        +'<div class="price">'+money(s.price)+(psf?'<span class="psf">$'+psf+'/sqft</span>':'')+'</div></div>';

      html+='<div class="facts"><span><b>'+s.bed+'</b> bd</span><span><b>'+s.bath+'</b> ba</span>'
        +'<span><b>'+Number(s.sqft).toLocaleString()+'</b> sqft</span>';
      if(s.cphMi!=null) html+='<span>CPH <b>'+s.cphMi+' mi / '+s.cphMin+' min</b></span>';
      html+='</div>';

      if(s.nearschool||s.nearpark||s.neargym||s.neartrail){
        html+='<div class="near">';
        if(s.nearschool) html+='<div><span class="dot" style="background:var(--school)"></span><b>School</b> <span>'+esc(s.nearschool)+'</span></div>';
        if(s.nearpark)   html+='<div><span class="dot" style="background:var(--park)"></span><b>Park</b> <span>'+esc(s.nearpark)+'</span></div>';
        if(s.neargym)    html+='<div><span class="dot" style="background:var(--gym)"></span><b>Gym</b> <span>'+esc(s.neargym)+'</span></div>';
        if(s.neartrail)  html+='<div><span class="dot" style="background:var(--trail)"></span><b>Trails</b> <span>'+esc(s.neartrail)+'</span></div>';
        html+='</div>';
      }
      if(s.publicNote) html+='<div class="note">'+esc(s.publicNote)+'</div>';
      html+='<div class="agent"><span>'+esc(s.mls||"")+'</span><span>'+esc(s.agent||"")+'</span>'
        +(s.phone?'<span><a class="tel" href="tel:'+esc(s.phone.replace(/[^0-9]/g,""))+'">'+esc(s.phone)+'</a></span>':'')+'</div>';
      c.innerHTML=html; host.appendChild(c);
    });
  }

  document.getElementById("foot").innerHTML =
    "Distances to Central Peninsula Hospital are real driving routes (OSRM). Nearest school / park / gym / trail are straight-line. "
    + "House coordinates from the US Census geocoder; amenities from OpenStreetMap. "
    + located + " of " + STOPS.length + " stops are mapped. "
    + "<br>Lockbox and keypad codes are deliberately NOT on this page — it is a public site. They stay in the printed tour sheet.";

  draw(); list();
})();
</script>
</body>
</html>
